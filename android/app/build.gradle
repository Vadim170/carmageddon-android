plugins {
    id 'com.android.application'
}

// Game files made by tools/prepare-data.sh from your own GOG installer
def gameData = file(findProperty('gameData') ?: "$rootDir/../game-data")
def gameAssetsDir = layout.buildDirectory.dir("generated/gameassets")
def gameResDir = layout.buildDirectory.dir("generated/gameres")
// -PnoGameData builds a small APK; data is then pushed with adb (see README)
def packGameData = !project.hasProperty('noGameData')

android {
    namespace 'com.dethrace.carmageddon'
    compileSdk 35
    ndkVersion '29.0.13599879'

    defaultConfig {
        applicationId 'com.dethrace.carmageddon'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DDETHRACE_SDL2_SOURCE_DIR=${rootDir}/../SDL2",
                        "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "$rootDir/../dethrace/CMakeLists.txt"
            version '3.31.6'
        }
    }

    buildTypes {
        debug {
            // the game is unplayable without optimisations
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Release" } }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            // SDLActivity and friends come with SDL itself
            java.srcDirs += "$rootDir/../SDL2/android-project/app/src/main/java"
            res.srcDirs += gameResDir
            if (packGameData) {
                assets.srcDirs += gameAssetsDir
            }
        }
    }

    androidResources {
        // data is copied out on first launch; skip recompressing ogg
        noCompress 'ogg'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def checkGameData = {
    if (!new File(gameData, 'c1/DATA/GENERAL.TXT').exists() || !new File(gameData, 'sp/DATA/GENERAL.TXT').exists()) {
        throw new GradleException("No game data in $gameData: run tools/prepare-data.sh with your GOG installer first")
    }
}

// Unpacking screens and launcher icons, rendered from the game's own files
tasks.register('generateGameResources', Exec) {
    inputs.dir(gameData)
    outputs.dir(gameResDir)
    doFirst { checkGameData() }
    commandLine 'python3', '-I', "$rootDir/../tools/make-resources.py", gameData, gameResDir.get().asFile
}
preBuild.dependsOn 'generateGameResources'

// Lay out the game data as assets/games/<id>/... plus an index file
tasks.register('prepareGameData') {
    inputs.dir(gameData)
    outputs.dir(gameAssetsDir)
    doLast {
        checkGameData()
        def out = gameAssetsDir.get().asFile
        project.delete(out)
        project.copy {
            from(gameData) { include 'c1/DATA/**', 'c1/MUSIC/**', 'sp/DATA/**', 'sp/MUSIC/**' }
            into "$out/games"
        }
        def lines = []
        def root = new File(out, 'games')
        root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            lines << root.toPath().relativize(f.toPath()).toString() + '\t' + f.length()
        }
        lines.sort()
        new File(root, 'index.txt').text = lines.join('\n') + '\n'
    }
}

if (packGameData) {
    preBuild.dependsOn 'prepareGameData'
}
